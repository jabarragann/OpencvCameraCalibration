[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cam_calib_lib"]

[project]
name = "cam_calib_lib"
version = "0.0.0"
dependencies = [
    "rick",
    "click",
    "pyprojroot"
]
requires-python = ">=3.10"
authors = [
    {name = "Juan Antonio Barragan", email = "jbarrag3@jh.edu"}
]
maintainers = [ 
    {name = "Juan Antonio Barragan", email = "jbarrag3@jh.edu"}
]
description = """
Charuco Camera Calibration Python package.
"""

readme = "README.md"
keywords = ["camera calibration"]
